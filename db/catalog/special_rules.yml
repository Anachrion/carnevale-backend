  description: When this character moves into base contact with an enemy character
    that is either 3" above or 3" below it at the start of the action, that enemy
    character skips their Protection roll for this character's Attack of Opportunity.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
