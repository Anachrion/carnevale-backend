  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: bored-to-inaction
  name: Bored to Inaction
  description: Any character (friendly or enemy) within 3" of Il Dottore must listen
    to him drone on. These characters do not benefit from any Commands used on them,
