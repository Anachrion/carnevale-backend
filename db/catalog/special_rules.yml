  spell_cost:
  spell_difficulty:
  spell_description:
- key: arcane-totem
  name: Arcane Totem
  description: This character knows every spell (including the Cantrip) from the Wild
    Magic Discipline. Each spell costs 0 Will Points to cast, but may only be attempted
    once per game. In addition, if this character ever fails to cast a spell, another
    spell is also removed at random.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: armourer
  name: Armourer
  description: 'At the beginning of the game, before deployment, select another friendly
    character to wear one of this character''s Masks. For the entirety of the game
    that character gains one of the following: Universal Shielding (2); or whenever
    that character makes a Combat action against a character with 0 Will Points remaining,
    if the attack deals at least 1 Damage, increase the damage caused by 1 (before
    any PROTECTION rolls). A character can only be given a single Mask. Unique characters
    without Faction (Gifted) and Mindless characters cannot be given a Mask.'
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: a-stately-ransom
  name: A Stately Ransom
  description: PULSE Command Ability Until the end of the round, enemy characters
    grant 1 coin when killed out of line of sight, or 2 coins when killed in line
    of sight (instead of 1).
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: atonement-from-above
  name: Atonement from Above
  description: Before applying Stoneskin, if this character would take damage from
