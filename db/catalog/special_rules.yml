  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: bucket-of-blood
  name: Bucket of Blood
  description: At the start of the game, when selecting spells, you may select a Blood
    Rites spell not known by any other friendly Mage for this character to store.
