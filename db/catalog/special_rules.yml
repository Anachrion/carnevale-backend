    after resolving all effects, this character replenishes 1 Will Point.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: till-death-do-us-part
  name: Till Death Do Us Part
  description: When this character is reduced to 5 Life Points or less, it gains +2
    ATTACK and Mindless.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: toot-toot-toot-charge
