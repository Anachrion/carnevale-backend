    on any roll - one re-roll per dice.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: always-scheming
  name: Always Scheming
  description: When a friendly character with the Leader keyword uses a Command while
    in line of sight, Brighella gains 1AP until the end of the round. Remember that
    no character can use more than 3AP in one round!
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: ancient-horror
  name: Ancient Horror
  description: PULSE Command Ability Until the end of the round, other friendly characters
