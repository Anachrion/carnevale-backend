  spell_cost:
  spell_difficulty:
  spell_description:
- key: chain-of-command
  name: Chain of Command
  description: This character may only use the ORDER or COUNTER Commands on characters
    with the Soldier keyword.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: cheat
  name: Cheat
  description: If this is the only character with the Leader keyword in the gang,
    this character loses the Hero keyword. However, if the gang contains Il Capitano,
    this character loses the Leader keyword.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: clairvoyancy
  name: Clairvoyancy
  description: AURA Command Ability. Until the end of the round, any friendly characters
    within 6" may re-roll 1 dice on any of their rolls. Note that this does not include
    the Destiny dice!
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: climber
