  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: candid-soul
  name: Candid Soul
  description: For every Life Point this character uses as a Will Point due to Frenzied,
    all other friendly characters without this rule within 3" replenish 1 Life Point.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: carrion
  name: Carrion
  description: Before deployment, choose 3 friendly characters. They gain Infiltration.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: cartomancy
  name: Cartomancy
  description: If this character successfully casts a Cantrip, this character or any
    friendly character within 6" replenishes 1 Will Point.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: cast-sentence
  name: Cast Sentence
  description: Whenever a character Judged by this character is killed, this character
    replenishes 3 Life Points or 1 Command Point.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: censer-bearer
  name: Censer Bearer
  description: Any friendly character that starts its turn within 6" and in line of
    sight of this character replenishes 1 Will Point. Characters with the Censer Bearer
