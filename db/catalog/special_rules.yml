    a roll.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: all-according-to-plan
  name: All According to Plan
  description: Colombina has a plan, and provided everyone plays their role, it'll
    all work out in the end. Once per round, when any character with line of sight
    to this character (including herself) is about to make a roll with at least 1
    dice, you can decide to score a single Ace instead of rolling.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: all-eyes-on-me
  name: All Eyes On Me
  description: For every friendly character in line of sight to this character (including
    this character) at the start of the round, add a re-roll to your All Eyes On Me
