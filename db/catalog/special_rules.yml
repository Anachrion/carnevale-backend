  name: Climbing Suckers
  description: When this character makes a DEXTERITY roll as part of a Run/Climb action,
    it counts all fumbles as failures.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: collector-of-treasures
