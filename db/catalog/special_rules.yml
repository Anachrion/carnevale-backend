---
- key: creative-creation
  name: ''
  description: Maria Fioritura may use the following unique Magic Spell. This spell
    cannot be used by other characters. She knows this in addition to any other spells.
  spell_name: Creative Creation
  spell_cost: 2
  spell_difficulty: 7
  spell_description: Place 1 Painted Protector anywhere within 3" of this character.
    A Painted Protector counts as a friendly character and may take a turn that round
    as normal.
- key: dagonite-baptism
  name: ''
  description: The Drowned Nun may use the following unique Magic Spell. This spell
    cannot be used by other characters. She knows this in addition to any other spells.
  spell_name: Dagonite Baptism
  spell_cost: 1
  spell_difficulty: 6
  spell_description: Total up every Ace rolled then pick one enemy character in line
    of sight within 3". That character loses that many Life Points plus 1.
- key: a-bounty-worth-taking
  name: A Bounty Worth Taking
  description: "Whenever a friendly character in line of sight kills an enemy character,
    add 1 coin to your coin pile. At the start of any friendly character's turn, you
    may spend any number of coins from your pile to give that character the following
    benefits for that character's turn, at the cost of 1 coin per benefit (each may
    only be chosen once per turn): \r\n• Gain Aerial Attack \r\n• Gain Acrobatic (2)
    \r\n• Gain Fast Swimmer (2) \r\n• Gain First Strike (1) \r\n• Replenish 1 Will
    Point or 1 Command Point"
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
