  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: brain-leech
  name: Brain Leech
  description: When this character replenishes Life Points due to the Vampiric Attack
    ability, the target character lowers any abilities with a number down by 1 until
