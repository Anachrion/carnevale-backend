  description: PULSE Command Ability. Pick one friendly character within 3" and one
    different friendly character with the House of Virtue keyword within line of sight.
    Both of those characters make an immediate Run/Climb action. This movement cannot
    be used to charge, but can be used to disengage.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: communion-for-the-sinless
  name: Communion for the Sinless
  description: When this character kills an enemy character that has 0 Will Points
    remaining (after absolving its sins), it replenishes 2 Will Points.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: confusing-exit
  name: Confusing Exit
  description: When this character successfully disengages, any enemy characters that
    were in base contact receive a Stunned counter.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
