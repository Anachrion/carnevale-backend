    with the Hero keyword, he gains Vampiric Attack (1). When attacking a character
    with the Leader keyword, he gains Vampiric Attack (3).
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: convulsing
  name: Convulsing
  description: This character is able to move through spaces smaller than its base
    to a minimum of 2". It must be able to fit where it ends its turn.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: coordinated-attack
  name: Coordinated Attack
  description: PULSE Command Ability. All friendly characters with the Ottoman keyword
    within 3" (including this one) gain First Strike (2) until the end of the round.
