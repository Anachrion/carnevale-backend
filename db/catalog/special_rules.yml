  spell_cost:
  spell_difficulty:
  spell_description:
- key: corpse
  name: Corpse
  description: If this character takes 4 or more Damage in one action (before making
    a Protection roll), add 2 extra Damage to the attack.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: corrupted-relic
  name: Corrupted Relic
  description: Whenever an enemy character within 6" and Line of Sight of this character
    makes a Basic roll, they must re-roll a single Ace in that roll.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: cosmic-harmony
  name: Cosmic Harmony
