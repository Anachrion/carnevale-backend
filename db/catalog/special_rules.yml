    and do not count as Attacks of Opportunity from charging & charging from above.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: undying-deathseeker
  name: Undying Deathseeker
  description: When this character is killed, do not remove it from the board, it
    remains in play but cannot be targeted or chosen. At the start of the next round,
    make a Basic MIND Roll (Will Points may be used as normal). If successful, this
    character comes back to life with 7 Life Points. If the MIND Roll is unsuccessful,
    the character is completely dead and removed from the board.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: unliving-curse
  name: Unliving Curse
  description: PULSE Command Ability. One friendly character within 1" gains Vampiric
    Attack (2) until the end of the game.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: unsightly
  name: Unsightly
  description: This character can be deployed anywhere on the board at ground level,
    at least 6" away from any enemy characters or objectives.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: unstable
  name: Unstable
  description: Any failed Combat actions with Alchemical Bombs and Poison Bombs always
    count as fumbles.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: unstable-wretch
  name: Unstable Wretch
  description: From the start of the second round onwards, at the end of this character's
    turn all characters (friendly and enemy, including this character) within 3" lose
    1 Life Point.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: unwieldy
  name: Unwieldy
  description: This character may only make Combat actions with the Twin Duelling
    Pistols as the first action of their turn (including using it for Attacks of Opportunity).
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: vampire-hunter
  name: Vampire Hunter
  description: When making a Combat action against a character with 0 Will Points
    remaining, Thomas may re-roll all dice, including the Destiny Dice.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: vatican-apostate
  name: Vatican Apostate
  description: This character can re-roll the destiny dice when making Attack or Protection
    rolls.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: venetian-drive
  name: Venetian Drive
  description: PULSE Command Ability. This character gains First Strike (2) until
    the end of the round, however it reduces its PROTECTION to 1.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: victory-rush
  name: Victory Rush
  description: 'When this character kills an enemy character with a Combat action,
    it gains your choice of either: an additional 1AP, replenish 4 Life Points, or
    replenish 2 Will Points.'
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: vindictive
  name: Vindictive
  description: If an enemy character causes damage to Mezzetino (before Protection
    Rolls), he may re-roll any failed dice rolls for Combat actions against that character
    for the rest of the game, including the Destiny Dice.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: void-walker
  name: Void Walker
  description: PULSE Command Ability. One friendly character within 3" gains Ethereal
    until the end of the game.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: volatile-arc-power
  name: Volatile Arc Power
  description: After resolving a successful Combat action with an Electron Cannon,
    pick 1 other character within 3" of the target (friend or foe – including this
    character), they lose an equal amount of Life Points as the original target. If
    there are no other characters in range, this rule has no effect.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: voltaic-shield
  name: Voltaic Shield
  description: If an enemy character makes a Combat action against this character
    in base contact and they don't lose any Life Points from the attack, the enemy
    character loses 3 Life Points.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: wages-are-here
  name: Wages Are Here
  description: PULSE Command Ability. Any friendly characters in line of sight with
    the Soldier keyword that aren't in base contact with an enemy may immediately
    make a Run/Climb action for 0AP, but must move into base contact with this character.
    This move does not cause Attacks of Opportunity. Any characters that move into
    base contact immediately replenish 1 Will Point.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: walk-through-the-fire-and-you-will-not-be-burned
  name: Walk Through The Fire And You Will Not Be Burned
  description: 1AP. The Saint summons holy flame around her! At the end of the round,
    place the Blast marker over this character. Any enemy character at least partially
    touched by this template (and within 1" vertically of the Burning Saint) loses
    3 Life Points. Characters may only be affected by this ability once per round,
    no matter how many times it's used by any number of Burning Saints! If the Burning
    Saint enters water after using this ability it is cancelled.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: warlord
  name: Warlord
  description: Friendly characters with the Soldier keyword may use this character's
    MIND instead of their own while they are in Line of Sight of this character.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: water-affinity
  name: Water Affinity
  description: This character always knows the magic spell Waves of Force in addition
    to its regular allowance, even if choosing to take spells from a different discipline.
    This character may use the Cast Spell action while in water.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: watered-down
  name: Watered Down
  description: At the end of the round, if this character is in water, it is killed.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: we-trained-for-this
  name: We Trained For This
  description: AURA Command Ability. All friendly characters within 6" increase their
    Fast Swimmer (X) value by 2 until the end of the round. Any characters without
    Fast Swimmer are unaffected.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: whispers-on-the-street
  name: Whispers on the Street
  description: For every friendly character with this ability in your gang at the
    start of the round, add a re-roll to your Mob Mentality Pool. Until the end of
    the round, any friendly character may use these re-rolls on any roll - one re-roll
    per dice.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: work-of-art
  name: Work of Art
  description: This character cannot be chosen as part of a gang, and gives no Victory
    Points if killed. In addition, if this character is killed, the Maria Fioritura
    that created it replenishes 1 Will Point.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: writhe-inside
  name: Writhe Inside
  description: When this character successfully damages an enemy character (after
    its Protection roll), you may remove this character from the game as if it were
    killed. If you do, place it on the damaged character's card. For the rest of the
    game, that character always counts as having a Stun counter.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: you-there-do-something
  name: You there! Do something!
  description: AURA Command Ability. Until the end of the round, other friendly characters
    that start their turn within 6" and line of sight of this character gain First
    Strike (2) until the end of their turn. Characters can only be affected by this
    Command Ability once each game round.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
