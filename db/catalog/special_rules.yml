    actions when Coviello is the target.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: apprenticeship
  name: Apprenticeship
  description: When choosing this character, pick one character in your gang with
    both the Doctor and Hero keywords to be this character's mentor. Choose one Character
