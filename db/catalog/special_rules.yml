  spell_cost:
  spell_difficulty:
  spell_description:
- key: righteous-zeal
  name: Righteous Zeal
  description: Every friendly character gains Brave while in line of sight of this
    character.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: rings-of-puissance
  name: Rings of Puissance
