    every character (friendly and enemy) in base contact.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: bring-it-down
  name: Bring it Down!
  description: PULSE Command Ability. One friendly character within 6" gains Hunter
