    of this character.
  spell_name:
  spell_cost:
  spell_difficulty:
  spell_description:
- key: business-or-pleasure
  name: Business or Pleasure?
  description: Any friendly character with the Councillor keyword with 0 Command Points
    remaining replenishes 1 Command Point if they start their turn within 6" and line
