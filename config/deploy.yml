# Kamal deploy config for carnevale_backend.
# Single Hetzner VM: app container (Puma + Thruster + Solid Queue) + Postgres accessory.
# Docs: https://kamal-deploy.org
#
# >>> Before your first deploy: find-and-replace 62.238.30.155 everywhere in this file
#     with your Hetzner server's public IPv4 (e.g. 91.99.12.34). That single
#     replace fixes every line, including the sslip.io host below.
#
# "<ip>.sslip.io" resolves to your IP automatically, so kamal-proxy can get a
# free Let's Encrypt certificate with no domain purchase. Swap it for a real
# domain later by editing proxy.host + FRONTEND_URL.

service: carnevale_backend

# Image lives in GitHub Container Registry (must be lowercase).
image: anachrion/carnevale_backend

servers:
  web:
    - 62.238.30.155

# kamal-proxy terminates TLS and routes :443 -> the app container.
# Each host gets its own free Let's Encrypt cert (HTTP-01), so every host below MUST
# resolve to this server's IP before deploying or cert issuance fails. sslip.io is kept
# alongside the real domain so existing alpha APKs (built with API_HOST=...sslip.io) keep working.
proxy:
  ssl: true
  hosts:
    - carnevale-app.com
    - www.carnevale-app.com
    - 62.238.30.155.sslip.io
  # app_port defaults to 80, which is where Thruster listens. No need to set it.

registry:
  server: ghcr.io
  username: Anachrion
  password:
    - KAMAL_REGISTRY_PASSWORD   # a GitHub PAT with write:packages (see .kamal/secrets)

# The server is an Intel/AMD (x86) CX23, so build for amd64. Because your Mac is
# arm64, this first build uses QEMU emulation and can be slow (a few minutes) --
# that's expected. If it's too slow, uncomment `remote:` to build natively on the
# server instead (no emulation).
builder:
  arch: amd64
  # remote: ssh://root@62.238.30.155
  # Build from the working tree, NOT the default `git archive` of HEAD. Git archives contain only
  # LFS *pointer* files, so the default would ship 132-byte pointers for public/cards/*.png instead
  # of the real images. With `context: .` Kamal uses the checked-out files (run `git lfs pull` on
  # any machine you deploy from so they're materialised). .dockerignore still excludes /.git etc.
  context: .

env:
  clear:
    # Run the Solid Queue supervisor inside Puma (config/puma.rb loads the plugin
    # when this is set). The queue/cache/cable schemas are installed (db/*_schema.rb)
    # and db:prepare creates their databases on boot, so background jobs, the durable
    # cache, and Action Cable all run on Postgres via the Solid stack — no Redis.
    SOLID_QUEUE_IN_PUMA: true
    WEB_CONCURRENCY: 2
    # The app reaches the Postgres accessory by its container name on the kamal network.
    DB_HOST: carnevale_backend-db
    DB_PORT: 5432
    DB_USERNAME: carnevale_backend
    # Used for password-reset email links + Action Cable allowed origins.
    # Point this at your real frontend when it exists; for now it's the API's own URL.
    FRONTEND_URL: https://carnevale-app.com
    # Backoffice card rendering: Grover's headless Chromium loads the card page from here.
    # Point at the container-internal Thruster (:80) so it never hair-pins out to the public
    # host. Must stay reachable from inside the app container.
    CARD_RENDER_BASE_URL: http://localhost
  secret:
    - RAILS_MASTER_KEY
    - CARNEVALE_BACKEND_DATABASE_PASSWORD
    # Shared client key. Every API request must carry it as X-Api-Key; the check in
    # AuthenticatesClient fails OPEN when this is blank, so the moment it is set here
    # any client built without a matching --dart-define=API_KEY starts getting 401s.
    # See docs/DEPLOYMENT.md "Rotating or enabling API_KEY" before changing it.
    - API_KEY

# Persist Active Storage uploads across deploys (config.active_storage.service = :local).
volumes:
  - "carnevale_backend_storage:/rails/storage"
  # Persist the hosted card images so backoffice "Render to catalog" survives redeploys.
  # Docker seeds this named volume from the image's committed public/cards on the FIRST deploy
  # (real LFS bytes, since the image is built from the working tree), then the volume becomes
  # the source of truth. Consequence: once the volume exists, NEW/changed images committed to
  # git no longer appear on deploy (the volume masks the image dir) — publish them on the server
  # via the backoffice Render-to-catalog action instead, which also bumps internal_version in
  # Postgres so /api/v1/cards/manifest advertises the change. To force-reseed from git, remove
  # the volume (`kamal server exec docker volume rm carnevale_backend_cards`) and redeploy.
  - "carnevale_backend_cards:/rails/public/cards"

accessories:
  db:
    image: postgres:17
    host: 62.238.30.155
    # Publish only to localhost on the host so Postgres isn't exposed to the internet;
    # the app connects over the internal kamal Docker network instead.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: carnevale_backend
        POSTGRES_DB: carnevale_backend_production
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - carnevale_backend_db_data:/var/lib/postgresql/data

# Handy shortcuts: `kamal console`, `kamal logs`, `kamal shell`, `kamal dbc`
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
