openapi: 3.0.3

info:
  title: Carnevale API
  version: "1"

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://your-production-domain.com/api/v1
    description: Production

# Applies to every operation unless overridden. Endpoints that also need a user session declare
# both ApiKeyAuth and bearerAuth; the public catalogue endpoints inherit this ApiKeyAuth-only rule.
security:
  - ApiKeyAuth: []

paths:
  /signup:
    post:
      operationId: signup
      summary: Register a new user
      tags: [Session]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /login:
    post:
      operationId: login
      summary: Log in and receive a JWT
      description: On success, the JWT is returned in the `Authorization` response header as `Bearer <token>`. Send it back on subsequent requests to authenticate.
      tags: [Session]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          headers:
            Authorization:
              schema:
                type: string
              description: "Bearer JWT, e.g. `Bearer eyJhbGciOi...`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid email or password

  /logout:
    delete:
      operationId: logout
      summary: Revoke the current JWT
      tags: [Session]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "204":
          description: No content
        "401":
          description: Not authenticated

  /password:
    post:
      operationId: forgotPassword
      summary: Request a password reset email
      tags: [Session]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: OK — instructions sent if the email is on file
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

    patch:
      operationId: resetPassword
      summary: Set a new password using a reset token
      tags: [Session]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /account:
    patch:
      operationId: updateAccount
      summary: Update the current user's username
      tags: [Session]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Not authenticated
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /cable_tickets:
    post:
      operationId: createCableTicket
      summary: Mint a short-lived, single-use ticket for opening the ActionCable WebSocket
      description: >
        Returns a one-time ticket to pass as the `ticket` query parameter when connecting to
        `/cable`, so the reusable JWT never travels in the (loggable) WebSocket URL. The ticket
        expires within seconds and is consumed the first time it is redeemed.
      tags: [Session]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "201":
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket:
                    type: string
        "401":
          description: Not authenticated

  /lists:
    get:
      operationId: getLists
      summary: List the current user's lists
      tags: [Lists]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/List"
        "401":
          description: Not authenticated

    post:
      operationId: createList
      summary: Create a list owned by the current user
      tags: [Lists]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "401":
          description: Not authenticated
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /lists/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"

    get:
      operationId: getList
      summary: Get a list
      description: Returns 404 if the list doesn't belong to the current user.
      tags: [Lists]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "401":
          description: Not authenticated
        "404":
          description: Not found

    patch:
      operationId: updateList
      summary: Update a list
      description: Returns 404 if the list doesn't belong to the current user.
      tags: [Lists]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

    delete:
      operationId: deleteList
      summary: Delete a list
      description: Returns 404 if the list doesn't belong to the current user.
      tags: [Lists]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "204":
          description: No content
        "401":
          description: Not authenticated
        "404":
          description: Not found

  /list_entries:
    post:
      operationId: createListEntry
      summary: Add a card to a list
      description: Returns 404 if the list doesn't belong to the current user.
      tags: [ListEntries]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "201":
          description: Created — returns the updated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "401":
          description: Not authenticated
        "404":
          description: List not found
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /list_entries/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"

    patch:
      operationId: updateListEntryPosition
      summary: Move a card to a new position in the list
      description: Returns 404 if the entry's list doesn't belong to the current user.
      tags: [ListEntries]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryPositionInput"
      responses:
        "200":
          description: OK — returns the updated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "401":
          description: Not authenticated
        "404":
          description: Not found

    delete:
      operationId: deleteListEntry
      summary: Remove a card from a list
      description: Returns 404 if the entry's list doesn't belong to the current user.
      tags: [ListEntries]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: OK — returns the updated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "401":
          description: Not authenticated
        "404":
          description: Not found

  /list_entries/{id}/spells:
    parameters:
      - $ref: "#/components/parameters/Id"

    patch:
      operationId: setListEntrySpells
      summary: Set the spells (and Discipline) a Mage model knows
      description: >
        Replaces the model's committed Discipline and full set of known spells (rulebook p24).
        Only Mage models may know spells; the selection still saves if it breaks the rules, but
        the returned list will report selection_valid: false with the reason. Returns 404 if the
        entry's list doesn't belong to the current user.
      tags: [ListEntries]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEntrySpellsInput"
      responses:
        "200":
          description: OK — returns the updated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "401":
          description: Not authenticated
        "404":
          description: Not found

  /spells:
    get:
      operationId: getSpells
      summary: List all spells, optionally filtered by Discipline
      tags: [Spells]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      parameters:
        - name: discipline
          in: query
          required: false
          schema:
            type: string
            enum: [blood_rites, divinity, fateweaving, runes_of_sovereignty, wild_magic]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Spell"
        "401":
          description: Not authenticated

  /profiles:
    get:
      operationId: getProfiles
      summary: List all profiles
      tags: [Profiles]
      parameters:
        - name: faction
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"

  /profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"

    get:
      operationId: getProfile
      summary: Get a profile
      tags: [Profiles]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Not found

  /equipment:
    get:
      operationId: getEquipment
      summary: List all equipment
      tags: [Equipment]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Equipment"

  /scenarios:
    get:
      operationId: getScenarios
      summary: List all scenarios
      tags: [Scenarios]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scenario"

  /games:
    get:
      operationId: getGames
      summary: List the current user's games (to resume/reopen)
      description: Never includes games the current user has deleted, regardless of the other player's state.
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      parameters:
        - name: visibility
          in: query
          required: false
          description: Which of the current user's games to return.
          schema:
            type: string
            enum: [active, archived]
            default: active
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
        "401":
          description: Not authenticated

    post:
      operationId: createGame
      summary: Create a game, hosted by the current user
      description: ducat_limit and name default from the scenario if omitted.
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Not authenticated
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /games/join:
    post:
      operationId: joinGame
      summary: Join a game via its join_code
      description: |
        Idempotent if the current user has already joined. Returns 422 if the game is already
        full. Once the second player joins, the role and deployment roll-off winners are
        picked at random server-side. The role winner is revealed once that step of the flow
        is reached; the deployment winner is informational only (the zone itself is chosen at
        the table, not in-app).
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGameInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Not authenticated
        "404":
          description: No game with that join_code
        "422":
          description: Game is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /games/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"

    get:
      operationId: getGame
      summary: Get a game's full current state
      description: Returns 404 if the game doesn't exist or the current user isn't a participant. Agendas are only ever populated for the requesting player's own game_player entry.
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Not authenticated
        "404":
          description: Not found

    delete:
      operationId: deleteGame
      summary: Soft-delete this game for the current user only
      description: |
        Hides the game from the current user permanently (they can no longer GET or list it).
        The other player is unaffected and keeps seeing the game normally. Once every player
        has deleted the game, it is hard-deleted server-side.
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
        "404":
          description: Not found

  /games/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Id"

    patch:
      operationId: archiveGame
      summary: Archive this game for the current user only
      description: |
        Hides the game from the current user's default game list (`GET /games`), but it remains
        reachable via `GET /games/{id}`. Purely per-user — the other player's view is unaffected.
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Not authenticated
        "404":
          description: Not found

  /games/{id}/unarchive:
    parameters:
      - $ref: "#/components/parameters/Id"

    patch:
      operationId: unarchiveGame
      summary: Restore this game to the current user's default game list
      description: Reverses `archive` for the current user only.
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Not authenticated
        "404":
          description: Not found

  /games/{id}/role:
    parameters:
      - $ref: "#/components/parameters/Id"

    patch:
      operationId: pickRole
      summary: Pick Attacker or Defender (role roll-off winner only)
      description: |
        The roll-off winner is picked at random, server-side, as soon as the second player
        joins the game — there's no client-triggered roll. `won_role_roll` on the winner's
        GamePlayer entry is only revealed to clients once this step of the flow is reached.
        The other player is automatically assigned the remaining role.
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: Roll-off not resolved yet, or not the winner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /games/{id}/available_lists:
    parameters:
      - $ref: "#/components/parameters/Id"

    get:
      operationId: getAvailableGangs
      summary: The current user's lists, flagged selectable against this game's ducat_limit
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableGang"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: Role roll-off not resolved yet (asymmetric scenarios)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /games/{id}/select_gang:
    parameters:
      - $ref: "#/components/parameters/Id"

    patch:
      operationId: selectGang
      summary: Select a list as the current user's gang for this game
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectGangInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: List exceeds the game's ducat_limit, or role roll-off not resolved yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /games/{id}/players/{player_id}/list:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: player_id
        in: path
        required: true
        schema:
          type: integer

    get:
      operationId: getPlayerList
      summary: Either player's selected gang, in full (with entries)
      description: |
        Available for consultation by both participants once that player has picked a gang,
        regardless of whose turn it currently is — gang lists aren't secret once selected.
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: That player hasn't selected a gang yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /games/{id}/entries/{list_entry_id}/counters:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: list_entry_id
        in: path
        required: true
        schema:
          type: integer

    patch:
      operationId: updateCounters
      summary: Update status counters on one of the current player's own models
      description: |
        Only available while the game is in_progress, and only for entries in the requesting
        player's own gang — the opponent's models 404. Send just the counters to change;
        omitted ones keep their current values. The change is broadcast to both players as a
        `game_state` event (re-fetch the player list to see the new counters).
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCountersInput"
      responses:
        "200":
          description: The model's full updated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryState"
        "401":
          description: Not authenticated
        "404":
          description: Not found (including entries that belong to the opponent)
        "422":
          description: Wrong game status, invalid counter values, or an entry with no state (equipment)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /games/{id}/entries/{list_entry_id}/stats:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: list_entry_id
        in: path
        required: true
        schema:
          type: integer

    patch:
      operationId: updateStats
      summary: Update current HP/WP/CP on one of the current player's own models
      description: |
        Only available while the game is in_progress, and only for entries in the requesting
        player's own gang — the opponent's models 404. Send just the stats to change (absolute
        values, not deltas); omitted ones keep their current values and none may go below 0.
        The change is broadcast to both players as a `game_state` event.
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatsInput"
      responses:
        "200":
          description: The model's full updated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryState"
        "401":
          description: Not authenticated
        "404":
          description: Not found (including entries that belong to the opponent)
        "422":
          description: Wrong game status, a negative stat value, or an entry with no state (equipment)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /games/{id}/agendas/draw:
    parameters:
      - $ref: "#/components/parameters/Id"

    post:
      operationId: drawAgendas
      summary: Privately draw this player's Agenda cards
      description: |
        Never broadcast or visible to the opponent. Behavior depends on game status: while
        `agenda_draw`, draws the scenario's full initial hand (no request body). While
        `in_progress`, draws a single replacement card and requires `origin` in the body
        (`special_rule` or `command_point` — a card is never freely drawn mid-game, only
        granted by one of those). Every agenda a player has ever drawn — whether still in
        hand, scored, or discarded — can never be drawn again by that same player.
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrawAgendaInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrawAgendasResponse"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: Wrong game status, agendas already drawn, or invalid/missing origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /games/{id}/agendas/{agenda_id}/score:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/AgendaId"

    post:
      operationId: scoreAgenda
      summary: Score an Agenda from this player's hand (flat 1 Victory Point)
      description: |
        Only valid while the game is `in_progress`, and only for an agenda currently in the
        requesting player's hand. Takes no body. If the scenario carries the "Cycle" rule, scoring
        automatically draws a replacement card (origin `recycle`, linked back to this score) — this
        is driven by the scenario, not requested by the client.
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: Wrong game status, or agenda not in hand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /games/{id}/agendas/{agenda_id}/discard:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/AgendaId"

    post:
      operationId: discardAgenda
      summary: Discard an Agenda from this player's hand
      description: |
        Discards an agenda currently in the requesting player's hand. The valid `origin` depends on
        the game status:
          * during setup (`agenda_draw`/`deploying`), `unachievable` — the pre-game mulligan for an
            impossible or duplicated agenda, which always draws a replacement (origin `recycle`); or
          * while `in_progress`, `special_rule` or `command_point` — an in-play discard granted by
            one of those, which draws a replacement only when `recycle: true`.
        A discarded agenda is always visible to the opponent (even under the Secret rule).
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscardAgendaInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: Wrong game status, invalid/missing origin, or agenda not in hand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /games/{id}/turns/advance:
    parameters:
      - $ref: "#/components/parameters/Id"

    post:
      operationId: advanceTurn
      summary: Advance the requesting player's turn cursor
      description: |
        Moves only the requesting player's own turn cursor forward by one (never the opponent's),
        clamped to the scenario's turn count. The cursor is per-player and rewindable so a player
        can drop back to record a forgotten past-turn score, then step forward again. Blocked while
        the game isn't `in_progress` or the player has ended the game (see `finish`).
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: Can't advance the turn right now (not in progress, already at the last turn, or ended)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /games/{id}/turns/rewind:
    parameters:
      - $ref: "#/components/parameters/Id"

    post:
      operationId: rewindTurn
      summary: Rewind the requesting player's turn cursor
      description: |
        Moves only the requesting player's own turn cursor back by one, clamped to turn 1. Used to
        drop back and record a forgotten past-turn score before advancing forward again. Blocked
        while the game isn't `in_progress` or the player has ended the game.
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: Can't rewind the turn right now (not in progress, already at turn 1, or ended)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /games/{id}/finish:
    parameters:
      - $ref: "#/components/parameters/Id"

    post:
      operationId: finishGame
      summary: End the game from the requesting player's side
      description: |
        Marks the requesting player as finished and archives the game for them (moving it to their
        archived list); the opponent is untouched and keeps playing at their own pace. Only allowed
        on the scenario's final turn. Once both players finish, the game's `status` derives to
        `completed`. Reversible via `unfinish`.
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: You can only end the game on the final turn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /games/{id}/unfinish:
    parameters:
      - $ref: "#/components/parameters/Id"

    post:
      operationId: unfinishGame
      summary: Undo ending the game for the requesting player
      description: |
        Clears the requesting player's finished flag and un-archives the game (returning it to their
        active list), reopening play. If the game had derived to `completed`, it reverts to
        `in_progress`.
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Not authenticated
        "404":
          description: Not found
        "422":
          description: You haven't ended the game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /games/{id}/ready:
    parameters:
      - $ref: "#/components/parameters/Id"

    post:
      operationId: markReady
      summary: Confirm physical deployment is done
      description: Once both players are ready, the game's status becomes in_progress and an EntryState (current/starting HP, WP, CP, and status counters) is created for every model (Catalog::CardReference entry) in each player's list.
      tags: [Games]
      security:
        - ApiKeyAuth: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "401":
          description: Not authenticated
        "404":
          description: Not found

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer

    AgendaId:
      name: agenda_id
      in: path
      required: true
      schema:
        type: integer

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >
        Shared client key identifying an official Carnevale frontend. Required on every request
        when the server has API_KEY configured (production); requests without it get 401. It is
        enforced in addition to any bearer token. When API_KEY is unset (local/dev) the check is
        skipped.

  schemas:
    # ── Requests ────────────────────────────────────────────────────────────────

    LoginInput:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [email, password]
          properties:
            email:
              type: string
            password:
              type: string

    RegistrationInput:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [username, email, password, password_confirmation]
          properties:
            username:
              type: string
            email:
              type: string
            password:
              type: string
            password_confirmation:
              type: string

    ForgotPasswordInput:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [email]
          properties:
            email:
              type: string

    ResetPasswordInput:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [reset_password_token, password, password_confirmation]
          properties:
            reset_password_token:
              type: string
            password:
              type: string
            password_confirmation:
              type: string

    UpdateAccountInput:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [username]
          properties:
            username:
              type: string

    ListInput:
      type: object
      required: [list]
      properties:
        list:
          type: object
          required: [faction]
          properties:
            name:
              type: string
              nullable: true
            faction:
              type: string
            points:
              type: integer
              default: 100

    EntryInput:
      type: object
      required: [entry]
      properties:
        entry:
          type: object
          required: [list_id, entry_type, entry_id]
          properties:
            list_id:
              type: integer
            entry_type:
              type: string
              enum: [Catalog::CardReference, Catalog::Equipment]
            entry_id:
              type: integer

    EntryPositionInput:
      type: object
      required: [entry]
      properties:
        entry:
          type: object
          required: [position]
          properties:
            position:
              type: integer
              minimum: 1

    SetEntrySpellsInput:
      type: object
      required: [entry]
      properties:
        entry:
          type: object
          properties:
            discipline:
              type: string
              nullable: true
              description: The Discipline the model commits to; all known spells must belong to it. Null clears the selection.
              enum: [blood_rites, divinity, fateweaving, runes_of_sovereignty, wild_magic]
            spell_ids:
              type: array
              items:
                type: integer
              description: The exact set of known spell ids. Replaces any previous selection.

    CreateGameInput:
      type: object
      required: [scenario_id]
      properties:
        scenario_id:
          type: integer
        name:
          type: string
          nullable: true
          description: Defaults to the scenario's name if omitted.
        ducat_limit:
          type: integer
          nullable: true
          description: Defaults to the scenario's ducats if omitted.
        board_size:
          type: string
          nullable: true

    JoinGameInput:
      type: object
      required: [join_code]
      properties:
        join_code:
          type: string

    SelectGangInput:
      type: object
      required: [list_id]
      properties:
        list_id:
          type: integer

    RoleInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [attacker, defender]

    DrawAgendaInput:
      type: object
      description: Only used (and only required) while the game is `in_progress` — ignored during the initial `agenda_draw` batch draw.
      properties:
        origin:
          type: string
          enum: [special_rule, command_point]

    DiscardAgendaInput:
      type: object
      required: [origin]
      properties:
        origin:
          type: string
          enum: [unachievable, special_rule, command_point]
          description: |
            `unachievable` is the pre-game mulligan (valid during `agenda_draw`/`deploying`);
            `special_rule`/`command_point` are in-play discards (valid while `in_progress`).
        recycle:
          type: boolean
          default: false
          description: |
            Whether to immediately draw a replacement card (origin `recycle`) linked back to this
            discard. Only honoured for in-play discards; the `unachievable` mulligan always redraws.

    UpdateCountersInput:
      type: object
      required: [counters]
      properties:
        counters:
          type: object
          description: Partial set of counters to change — omitted ones keep their current values.
          properties:
            stunned:
              type: boolean
            hidden:
              type: boolean
            guarding:
              type: boolean
            carrying_objective:
              type: boolean
            underwater_counters:
              type: integer
              minimum: 0
              maximum: 2

    UpdateStatsInput:
      type: object
      required: [stats]
      properties:
        stats:
          type: object
          description: Partial set of current stat values to change — omitted ones keep their current values. Absolute values, not deltas.
          properties:
            life_points:
              type: integer
              minimum: 0
            will_points:
              type: integer
              minimum: 0
            command_points:
              type: integer
              minimum: 0

    # ── Responses ───────────────────────────────────────────────────────────────

    Session:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [id, email, username]
          properties:
            id:
              type: integer
            email:
              type: string
            username:
              type: string

    List:
      type: object
      required: [id, faction, points, total_cost, selection_valid, selection_errors, entries]
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
        faction:
          type: string
        points:
          type: integer
        total_cost:
          type: integer
        selection_valid:
          type: boolean
          description: Whether the current set of entries satisfies the gang composition rules (points limit, faction, uniqueness, Leader, Hero/Henchman ratio, etc).
        selection_errors:
          type: array
          items:
            type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ListEntry"

    ListEntry:
      type: object
      required: [id, position, entry_type, entry_id, name, cost, mage, spell_slots, disciplines, spells]
      properties:
        id:
          type: integer
        position:
          type: integer
        entry_type:
          type: string
          enum: [Catalog::CardReference, Catalog::Equipment]
        entry_id:
          type: integer
        name:
          type: string
        cost:
          type: integer
        state:
          allOf:
            - $ref: "#/components/schemas/EntryState"
          nullable: true
          description: Present once the game has started (POST /games/{id}/ready flips it to in_progress); null beforehand and for Catalog::Equipment entries, which have no HP/WP/CP to track.
        mage:
          type: boolean
          description: Whether this model is a Mage and can therefore be given spells. Always false for Equipment.
        spell_slots:
          type: integer
          description: Maximum number of non-Cantrip spells the model may know (Mage X + Expert Sorcerer X). 0 for non-Mages.
        disciplines:
          type: array
          items:
            type: string
          description: Discipline slugs the model may pick spells from, e.g. ["blood_rites", "divinity"].
        spell_discipline:
          type: string
          nullable: true
          description: The Discipline this model has committed to, or null if none picked yet.
        cantrip:
          allOf:
            - $ref: "#/components/schemas/Spell"
          nullable: true
          description: The free Cantrip the model always knows for its committed Discipline; null when no Discipline is picked. Not counted against spell_slots.
        spells:
          type: array
          items:
            $ref: "#/components/schemas/Spell"
          description: The non-free spells this model currently knows.

    Spell:
      type: object
      required: [id, name, discipline, cost, difficulty, cantrip, description]
      properties:
        id:
          type: integer
        name:
          type: string
        discipline:
          type: string
          enum: [blood_rites, divinity, fateweaving, runes_of_sovereignty, wild_magic]
        cost:
          type: integer
          description: Will Points spent to attempt the spell.
        difficulty:
          type: integer
          description: Magic Roll result needed to score an Ace.
        cantrip:
          type: boolean
          description: Whether this is the Discipline's free Cantrip (always known, doesn't count against spell_slots).
        description:
          type: string

    EntryState:
      type: object
      required: [life_points, will_points, command_points, stunned, hidden, guarding, carrying_objective, underwater_counters]
      properties:
        life_points:
          $ref: "#/components/schemas/EntryStatValue"
        will_points:
          $ref: "#/components/schemas/EntryStatValue"
        command_points:
          $ref: "#/components/schemas/EntryStatValue"
        stunned:
          type: boolean
        hidden:
          type: boolean
        guarding:
          type: boolean
        carrying_objective:
          type: boolean
        underwater_counters:
          type: integer
          minimum: 0
          maximum: 2

    EntryStatValue:
      type: object
      required: [current, starting]
      properties:
        current:
          type: integer
        starting:
          type: integer

    Profile:
      type: object
      required:
        - id
        - name
        - faction
        - ducats
        - movement
        - attack
        - dexterity
        - life_points
        - mind
        - will_points
        - protection
        - action_points
        - command_points
        - size
        - abilities
        - keywords
        - version
        - mage
        - spell_slots
        - disciplines
        - weapons
        - special_rules
        - card_references
      properties:
        id:
          type: integer
        name:
          type: string
        faction:
          type: string
        ducats:
          type: integer
        movement:
          type: integer
        attack:
          type: integer
        dexterity:
          type: integer
        life_points:
          type: integer
        mind:
          type: integer
        will_points:
          type: integer
        protection:
          type: integer
        action_points:
          type: integer
        command_points:
          type: integer
        size:
          type: integer
        abilities:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        version:
          type: string
        mage:
          type: boolean
          description: Whether the profile has the Mage ability and can be given spells (rulebook p24).
        spell_slots:
          type: integer
          description: Maximum number of non-Cantrip spells the model may know (Mage X + Expert Sorcerer X). 0 for non-Mages.
        disciplines:
          type: array
          items:
            type: string
          description: Discipline slugs the model may pick spells from, e.g. ["blood_rites", "divinity"].
        weapons:
          type: array
          items:
            $ref: "#/components/schemas/Weapon"
        special_rules:
          type: array
          items:
            $ref: "#/components/schemas/SpecialRule"
        card_references:
          type: array
          items:
            $ref: "#/components/schemas/CardReference"

    Weapon:
      type: object
      required: [id, name, damage, range, penetration, evasion, abilities]
      properties:
        id:
          type: integer
        name:
          type: string
        damage:
          type: integer
        range:
          type: integer
        penetration:
          type: integer
        evasion:
          type: integer
        abilities:
          type: array
          items:
            type: string

    SpecialRule:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        spell_name:
          type: string
          nullable: true
        spell_cost:
          type: integer
          nullable: true
        spell_difficulty:
          type: integer
          nullable: true
        spell_description:
          type: string
          nullable: true

    CardReference:
      type: object
      required: [id, identifier]
      properties:
        id:
          type: integer
        identifier:
          type: string
        name:
          type: string
          nullable: true
        card_front:
          type: string
          nullable: true
        card_back:
          type: string
          nullable: true

    Equipment:
      type: object
      required: [id, name, description, cost]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        cost:
          type: integer

    ValidationErrors:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    Scenario:
      type: object
      required:
        - id
        - name
        - ducats
        - asymmetric
        - setup
        - primary_objective
        - agendas
        - agenda_rules
        - agenda_count
        - special_rules
        - duration
        - turns
        - deployment_zones
      properties:
        id:
          type: integer
        name:
          type: string
        ducats:
          type: integer
          description: Default ducat limit recommended by the rulebook for this scenario.
        asymmetric:
          type: boolean
          description: True for scenarios with Attacker/Defender roles (e.g. Street Fight), which run a role roll-off once both players have joined.
        setup:
          type: string
        primary_objective:
          type: string
        agendas:
          type: array
          items:
            type: string
          description: Free-text rendering of the scenario's agenda instructions (e.g. "3 scoring 1 Victory Point each.", "Secret, Cycle, Double."). See `agenda_rules`/`agenda_count` for the structured form.
        agenda_rules:
          type: array
          items:
            type: string
            enum: [cycle, secondary, double, secret, total]
          description: The agenda special rules in effect for this scenario (rulebook p.36). `secret` hides opponents' in-hand agendas; `cycle` auto-draws a replacement when an agenda is scored.
        agenda_count:
          type: integer
          description: How many agendas each player draws for their initial hand.
        special_rules:
          type: array
          items:
            type: string
        duration:
          type: string
          description: Free-text rendering of the scenario's duration (e.g. "5 rounds."). See `turns` for the structured count.
        turns:
          type: integer
          description: Number of turns the scenario lasts.
        deployment_zones:
          type: array
          items:
            type: string
        illustration:
          type: string
          nullable: true

    Agenda:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string

    AgendaHistoryEntry:
      type: object
      required: [turn, action, origin, caused_by_event_id, agenda]
      properties:
        turn:
          type: integer
        action:
          type: string
          enum: [drawn, scored, discarded]
        origin:
          type: string
          nullable: true
          enum: [initial, unachievable, special_rule, command_point, recycle]
          description: Why this event happened. Always null for `scored` events — scoring just resolves the Agenda's own printed condition, it isn't granted by an external rule the way drawing/discarding is. `unachievable` marks a pre-game mulligan discard.
        caused_by_event_id:
          type: integer
          nullable: true
          description: Set only when origin is `recycle` — the id of the scored/discarded event (within this same list) that triggered this replacement draw.
        agenda:
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: string

    GangSummary:
      type: object
      required: [id, name, faction, points, total_cost]
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
        faction:
          type: string
        points:
          type: integer
        total_cost:
          type: integer

    GamePlayer:
      type: object
      required: [id, user_id, username, host, list, role, ready, won_role_roll, won_deployment_roll, score, current_turn, finished, agendas, agenda_history]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        username:
          type: string
        host:
          type: boolean
        list:
          allOf:
            - $ref: "#/components/schemas/GangSummary"
          nullable: true
        role:
          type: string
          enum: [attacker, defender]
          nullable: true
        ready:
          type: boolean
        won_role_roll:
          type: boolean
          description: True for the role roll-off winner (asymmetric scenarios only). Picked at random as soon as the second player joins.
        won_deployment_roll:
          type: boolean
          description: True for the deployment roll-off winner. Picked at random as soon as the second player joins. Informational only — the deployment zone itself is chosen at the table, not in-app.
        score:
          type: integer
          description: Total Victory Points scored from Agendas so far (every Agenda scores a flat 1 VP). Always visible for both players.
        current_turn:
          type: integer
          description: This player's own turn cursor (starts at 1). Rewindable via the turns/advance and turns/rewind endpoints; agenda events are stamped with whatever turn the player is pointed at. Independent of the opponent's.
        finished:
          type: boolean
          description: Whether this player has ended the game from their side (see the finish/unfinish endpoints). When both players are finished the game's status derives to `completed`.
        agendas:
          type: array
          description: This player's current hand. Always populated for the requesting player's own entry. For the opponent's entry it is populated too, unless the scenario has the `secret` agenda rule, in which case it is empty (the hand stays hidden until achieved).
          items:
            $ref: "#/components/schemas/Agenda"
        agenda_history:
          type: array
          description: Draw/score/discard events for this player, in turn order. Full history for the requesting player's own entry. For the opponent's entry under the `secret` rule it is trimmed to resolved events only (scored + discarded), so the hidden hand doesn't leak; otherwise it is the full history.
          items:
            $ref: "#/components/schemas/AgendaHistoryEntry"

    Game:
      type: object
      required: [id, name, join_code, status, ducat_limit, board_size, scenario, viewer_visibility, players]
      properties:
        id:
          type: integer
        name:
          type: string
        join_code:
          type: string
        status:
          type: string
          enum: [pending, gang_selection, agenda_draw, deploying, in_progress, completed]
          description: "`completed` is derived: reached only once both players have `finished`, and reverts to `in_progress` if either undoes."
        ducat_limit:
          type: integer
        board_size:
          type: string
          nullable: true
        scenario:
          $ref: "#/components/schemas/Scenario"
        viewer_visibility:
          type: string
          enum: [active, archived, deleted]
          description: The requesting user's own archive/delete state for this game — never reflects the opponent's.
        players:
          type: array
          items:
            $ref: "#/components/schemas/GamePlayer"

    AvailableGang:
      type: object
      required: [list, selectable]
      properties:
        list:
          $ref: "#/components/schemas/GangSummary"
        selectable:
          type: boolean
          description: False when list.points exceeds the game's ducat_limit.

    DrawAgendasResponse:
      type: object
      required: [agendas]
      properties:
        agendas:
          type: array
          items:
            $ref: "#/components/schemas/Agenda"
